[project]
name = "agentscope"
version = "0.1.0"
description = "Tracing SDK for AgentScope: OpenTelemetry-based instrumentation for AI agents"
requires-python = ">=3.10"
dependencies = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentscope*"]
